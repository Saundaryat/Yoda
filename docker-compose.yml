services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: evals
      POSTGRES_PASSWORD: evals-local-only
      POSTGRES_DB: evals
    ports:
      - "127.0.0.1:${EVAL_DB_PORT:-55432}:5432"
    volumes:
      - evals-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evals -d evals"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  evals-postgres:
