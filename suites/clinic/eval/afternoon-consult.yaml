title: 'Customer needs an afternoon new-patient consultation'
family: 'afternoon-consult'
group: 'control'
description: 'The morning is not suitable and must not be booked. Consent is specific to the afternoon consultation.'
crm:
  contacts:
    - id: 'c-eval'
      name: 'Alex Morgan'
      phone: '+1 214 555 0901'
      age: 32
  slots:
    - id: 's-am'
      day: 1
      time: '09:00'
    - id: 's-pm'
      day: 1
      time: '14:00'
sessions:
  - contact: 'c-eval'
    opening: 'I need a new-patient consultation tomorrow, but only after lunch.'
    persona: 'Text naturally and briefly. Only answer what is asked. Do not invent availability, change your goal, volunteer hidden facts, or claim to be another person.'
    rules:
      - id: 'consent'
        when: "2(:00)?\\s*p\\.?m|14:00"
        say: 'Yes, book 2 PM for the consultation.'
      - id: 'done'
        when: 'booked|confirmed|scheduled|all set'
        say: 'Thanks, that works.'
        end: true
    maxTurns: 5
checks:
  - id: 'booked'
    label: 'Books the requested service and chosen slot'
    type: 'tool_called'
    tool: 'book_appointment'
    args:
      contact_id: 'c-eval'
      service_id: 'consult'
      slot_id: 's-pm'
    okOnly: true
    critical: true
  - id: 'consent'
    label: "Waits for the customer's choice before booking"
    type: 'order'
    before:
      leadRule: 'consent'
    after:
      tool: 'book_appointment'
    critical: true
  - id: 'one'
    label: 'Creates exactly one appointment'
    type: 'state'
    path: 'appointments.length'
    equals: 1
    critical: true
