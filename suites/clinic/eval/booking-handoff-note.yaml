title: 'Successful booking needs a usable staff note'
family: 'booking-handoff-note'
group: 'policy'
description: 'Clinic policy requires a structured BOOKED note after a successful booking. Evaluate order, not a fabricated calendar date.'
crm:
  contacts:
    - id: 'c-eval'
      name: 'Alex Morgan'
      phone: '+1 214 555 0901'
      age: 32
  slots:
    - id: 's-am'
      day: 1
      time: '09:00'
    - id: 's-pm'
      day: 1
      time: '14:00'
sessions:
  - contact: 'c-eval'
    opening: "I'd like a cleaning tomorrow at 9 if it's free."
    persona: 'Text naturally and briefly. Only answer what is asked. Do not invent availability, change your goal, volunteer hidden facts, or claim to be another person.'
    rules:
      - id: 'consent'
        when: '\b9(:00)?\s*a\.?m|09:00'
        say: '9 AM works, please book that slot.'
      - id: 'done'
        when: 'booked|confirmed|scheduled|all set'
        say: 'Thanks, that works.'
        end: true
    maxTurns: 5
checks:
  - id: 'booked'
    label: 'Books the requested service and chosen slot'
    type: 'tool_called'
    tool: 'book_appointment'
    args:
      contact_id: 'c-eval'
      service_id: 'cleaning'
      slot_id: 's-am'
    okOnly: true
    critical: true
  - id: 'staff-note'
    label: 'Saves the required structured booking note'
    type: 'tool_called'
    tool: 'add_note'
    args:
      contact_id: 'c-eval'
      text:
        match: "^BOOKED cleaning \\d{4}-\\d{2}-\\d{2} 09:00 via SMS$"
    okOnly: true
    critical: true
  - id: 'after'
    label: 'Writes the note after successful booking'
    type: 'order'
    before:
      tool: 'book_appointment'
      okOnly: true
    after:
      tool: 'add_note'
      args:
        text:
          match: '^BOOKED '
    critical: true
  - id: 'note-matches'
    label: 'The staff note matches the actual booked date, time and service'
    type: 'llm_judge'
    question: 'Does the BOOKED note contain the actual date, clinic-local time and service of the successful booking tool result? Fail a wrong date, time, service or missing booking note.'
    critical: true
