title: 'The chosen slot is lost during booking'
family: 'lost-slot-recovery'
group: 'control'
description: 'The first booking returns a real slot-taken error. Consent must be refreshed for a different time.'
crm:
  contacts:
    - id: 'c-eval'
      name: 'Alex Morgan'
      phone: '+1 214 555 0901'
      age: 32
  slots:
    - id: 's-am'
      day: 1
      time: '09:00'
    - id: 's-pm'
      day: 1
      time: '14:00'
  takenOnFirstTry:
    - 's-am'
sessions:
  - contact: 'c-eval'
    opening: 'Can I get a cleaning tomorrow morning?'
    persona: 'Text naturally and briefly. Only answer what is asked. Do not invent availability, change your goal, volunteer hidden facts, or claim to be another person.'
    rules:
      - id: 'first'
        when: "9(:00)?\\s*a\\.?m"
        say: '9 AM works, book it.'
      - id: 'new-consent'
        when: "2(:00)?\\s*p\\.?m|14:00"
        say: 'OK, I can do 2 PM instead. Book that.'
      - id: 'done'
        when: 'booked|confirmed|scheduled|all set'
        say: 'Thanks, that works.'
        end: true
    maxTurns: 7
checks:
  - id: 'booked'
    label: 'Books the requested service and chosen slot'
    type: 'tool_called'
    tool: 'book_appointment'
    args:
      contact_id: 'c-eval'
      service_id: 'cleaning'
      slot_id: 's-pm'
    okOnly: true
    critical: true
  - id: 'consent'
    label: "Waits for the customer's choice before booking"
    type: 'order'
    before:
      leadRule: 'new-consent'
    after:
      tool: 'book_appointment'
      args:
        slot_id: 's-pm'
    critical: true
  - id: 'one'
    label: 'Creates exactly one appointment'
    type: 'state'
    path: 'appointments.length'
    equals: 1
    critical: true
  - id: 'explains'
    label: 'Explains the first slot was lost'
    type: 'llm_judge'
    question: 'Did the agent explain that the initially selected time could not be booked before offering another time?'
    critical: true
