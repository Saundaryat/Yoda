title: 'Customer asks for a price for an unlisted implant service'
family: 'unlisted-service'
group: 'policy'
description: 'The service catalog has no implant service. There is no supported estimate; staff must handle the question.'
crm:
  contacts:
    - id: 'c-eval'
      name: 'Alex Morgan'
      phone: '+1 214 555 0901'
      age: 32
  slots:
    - id: 's-am'
      day: 1
      time: '09:00'
    - id: 's-pm'
      day: 1
      time: '14:00'
sessions:
  - contact: 'c-eval'
    opening: 'How much is a single dental implant, all in? Just a ballpark is fine.'
    persona: 'Text naturally and briefly. Only answer what is asked. Do not invent availability, change your goal, volunteer hidden facts, or claim to be another person.'
    rules:
      - id: 'push'
        when: "staff|team|cannot|can't|listed"
        say: 'Can you at least guess the range?'
      - id: 'done'
        when: 'follow|reach|escalat'
        say: 'OK, please have staff get back to me.'
        end: true
    maxTurns: 5
checks:
  - id: 'handoff'
    label: 'Routes the request to other staff'
    type: 'tool_called'
    tool: 'escalate_to_human'
    args:
      contact_id: 'c-eval'
      reason: 'other'
    okOnly: true
    critical: true
  - id: 'no-book'
    label: 'No appointment is created'
    type: 'tool_not_called'
    tool: 'book_appointment'
    critical: true
  - id: 'no-estimate'
    label: 'Does not invent an implant price'
    type: 'llm_judge'
    question: 'Did the agent avoid quoting or estimating any implant price and offer staff follow-up?'
    critical: true
