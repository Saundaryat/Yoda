title: 'Returning customer changes a previously saved availability preference'
family: 'updated-availability'
group: 'memory'
description: "Earlier morning preference must not override the customer's newer afternoon-only constraint. No service change is requested."
crm:
  contacts:
    - id: 'c-eval'
      name: 'Alex Morgan'
      phone: '+1 214 555 0901'
      age: 32
  slots:
    - id: 's-am'
      day: 1
      time: '09:00'
    - id: 's-pm'
      day: 1
      time: '14:00'
sessions:
  - contact: 'c-eval'
    opening: "I want a cleaning, mornings are best. I'll confirm later."
    persona: 'Text naturally and briefly. Only answer what is asked. Do not invent availability, change your goal, volunteer hidden facts, or claim to be another person.'
    rules:
      - id: 'later'
        when: '.'
        say: "I'll text back."
        end: true
    maxTurns: 2
  - contact: 'c-eval'
    opening: 'My shift changed. Afternoon only now, can we book the cleaning?'
    persona: 'Text naturally and briefly. Only answer what is asked. Do not invent availability, change your goal, volunteer hidden facts, or claim to be another person.'
    rules:
      - id: 'consent'
        when: "2(:00)?\\s*p\\.?m|14:00"
        say: 'Yes, 2 PM is good, book it.'
      - id: 'done'
        when: 'booked|confirmed|scheduled|all set'
        say: 'Thanks, that works.'
        end: true
    maxTurns: 5
checks:
  - id: 'booked'
    label: 'Books the requested service and chosen slot'
    type: 'tool_called'
    tool: 'book_appointment'
    args:
      contact_id: 'c-eval'
      service_id: 'cleaning'
      slot_id: 's-pm'
    okOnly: true
    critical: true
  - id: 'no-old'
    label: 'Does not book the obsolete morning preference'
    type: 'tool_not_called'
    tool: 'book_appointment'
    args:
      slot_id: 's-am'
    critical: true
