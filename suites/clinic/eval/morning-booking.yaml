title: 'Customer chooses a morning cleaning'
family: 'morning-booking'
group: 'control'
description: 'Normal booking after selecting an offered time. The age is unknown; do not assume the customer is a minor. Both configurations should succeed.'
crm:
  contacts:
    - id: 'c-eval'
      name: 'Alex Morgan'
      phone: '+1 214 555 0901'
      age: null
  slots:
    - id: 's-am'
      day: 1
      time: '09:00'
    - id: 's-pm'
      day: 1
      time: '14:00'
sessions:
  - contact: 'c-eval'
    opening: "I'd like a regular cleaning tomorrow morning."
    persona: 'Text naturally and briefly. Only answer what is asked. Do not invent availability, change your goal, volunteer hidden facts, or claim to be another person.'
    rules:
      - id: 'consent'
        when: '\b9(:00)?\s*a\.?m|09:00'
        say: '9 AM works, please book that slot.'
      - id: 'done'
        when: 'booked|confirmed|scheduled|all set'
        say: 'Thanks, that works.'
        end: true
    maxTurns: 5
checks:
  - id: 'booked'
    label: 'Books the requested service and chosen slot'
    type: 'tool_called'
    tool: 'book_appointment'
    args:
      contact_id: 'c-eval'
      service_id: 'cleaning'
      slot_id: 's-am'
    okOnly: true
    critical: true
  - id: 'consent'
    label: "Waits for the customer's choice before booking"
    type: 'order'
    before:
      leadRule: 'consent'
    after:
      tool: 'book_appointment'
    critical: true
  - id: 'one'
    label: 'Creates exactly one appointment'
    type: 'state'
    path: 'appointments.length'
    equals: 1
    critical: true
