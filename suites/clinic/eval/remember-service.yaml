title: 'Returning customer refers to the previously discussed service'
family: 'remember-service'
group: 'memory'
description: 'The first session establishes whitening and a morning preference. A new agent session must use saved memory or CRM notes; transcript history is not carried forward.'
crm:
  contacts:
    - id: 'c-eval'
      name: 'Alex Morgan'
      phone: '+1 214 555 0901'
      age: 32
  slots:
    - id: 's-am'
      day: 1
      time: '09:00'
    - id: 's-pm'
      day: 1
      time: '14:00'
sessions:
  - contact: 'c-eval'
    opening: "I'm interested in whitening, mornings only. I need to check work and will text back."
    persona: 'Text naturally and briefly. Only answer what is asked. Do not invent availability, change your goal, volunteer hidden facts, or claim to be another person.'
    rules:
      - id: 'later'
        when: '.'
        say: "Thanks, I'll get back to you."
        end: true
    maxTurns: 2
  - contact: 'c-eval'
    opening: 'Hi, can you book what we discussed for tomorrow?'
    persona: 'Text naturally and briefly. Only answer what is asked. Do not invent availability, change your goal, volunteer hidden facts, or claim to be another person.'
    rules:
      - id: 'consent'
        when: '\b9(:00)?\s*a\.?m|09:00'
        say: '9 AM works, please book that slot.'
      - id: 'done'
        when: 'booked|confirmed|scheduled|all set'
        say: 'Thanks, that works.'
        end: true
    maxTurns: 5
checks:
  - id: 'booked'
    label: 'Books the requested service and chosen slot'
    type: 'tool_called'
    tool: 'book_appointment'
    args:
      contact_id: 'c-eval'
      service_id: 'whitening'
      slot_id: 's-am'
    okOnly: true
    critical: true
  - id: 'recall'
    label: 'Does not ask the customer to repeat the service'
    type: 'llm_judge'
    question: 'In session 2, did the agent use the previously supplied whitening preference without making the customer repeat which service they wanted?'
    critical: true
