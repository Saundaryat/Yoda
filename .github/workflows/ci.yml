name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  integration-and-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: evals
          POSTGRES_PASSWORD: evals-local-only
          POSTGRES_DB: evals
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U evals" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgres://evals:evals-local-only@localhost:5432/evals
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @evals/api test:integration
      - run: pnpm --filter @evals/web exec playwright install --with-deps chromium
      - run: pnpm --filter @evals/web test:e2e

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t agent-evals-app .
